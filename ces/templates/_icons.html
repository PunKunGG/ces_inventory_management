{% macro icon(name, size=20, class='') -%}
<svg class="{{ class }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == 'logo' %}<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/><path d="M7 12h3l1.4-2.1L13 14l1.4-2H17"/>
  {% elif name == 'dashboard' %}<rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/>
  {% elif name == 'box' %}<path d="m3 7 9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10M7.5 5l9 4"/>
  {% elif name == 'movement' %}<path d="M4 7h15m-4-4 4 4-4 4m5 6H5m4-4-4 4 4 4"/>
  {% elif name == 'clock' %}<path d="M3.5 12a8.5 8.5 0 1 1 2.4 6M3 17.5h4.5V22M12 7.5V12l3 2"/>
  {% elif name == 'report' %}<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 16v-3m4 3V8m4 8v-5"/>
  {% elif name == 'users' %}<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2m1-15a3 3 0 0 1 0 6m2 3a4 4 0 0 1 3 4v2"/>
  {% elif name == 'tags' %}<path d="M21 11 11 21 3 13V3h10z"/><circle cx="7.5" cy="7.5" r=".8"/>
  {% elif name == 'location' %}<path d="M20 10c0 5-8 11-8 11s-8-6-8-11a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>
  {% elif name == 'tool' %}<path d="M14.5 6.5 18 3a6 6 0 0 0-7.5 7.5L3.8 17a2.3 2.3 0 0 0 3.2 3.2l6.5-6.7A6 6 0 0 0 21 6l-3.5 3.5z"/>
  {% elif name == 'warning' %}<path d="M10.5 4.8 3 18a1.8 1.8 0 0 0 1.6 2.7h14.8A1.8 1.8 0 0 0 21 18L13.5 4.8a1.7 1.7 0 0 0-3 0ZM12 9v4m0 3h.01"/>
  {% elif name == 'empty' %}<circle cx="12" cy="12" r="8.5"/><path d="m6 18 12-12"/>
  {% elif name == 'arrow' %}<path d="M5 12h14m-5-5 5 5-5 5"/>
  {% elif name == 'back' %}<path d="M19 12H5m5 5-5-5 5-5"/>
  {% elif name == 'logout' %}<path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5m-2-8h12m-4-4 4 4-4 4"/>
  {% elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
  {% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/>
  {% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
  {% elif name == 'download' %}<path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/>
  {% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
  {% elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3m-4 5v2"/>
  {% elif name == 'chevron' %}<path d="m9 6 6 6-6 6"/>
  {% elif name == 'in' %}<path d="M12 4v12m-5-5 5 5 5-5M4 17v3h16v-3"/>
  {% elif name == 'out' %}<path d="M12 16V4m-5 5 5-5 5 5M4 17v3h16v-3"/>
  {% elif name == 'return' %}<path d="M8 6 3 11l5 5M3 11h12a5 5 0 0 1 0 10h-2"/>
  {% elif name == 'edit' %}<path d="m4 16-1 5 5-1L20 8l-4-4zM14 6l4 4"/>
  {% endif %}
</svg>
{%- endmacro %}
